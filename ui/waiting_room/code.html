</style>
<script>
  // Simple countdown animation for preview purposes
  document.addEventListener('DOMContentLoaded', () => {
    const display = document.getElementById('countdown-display');
    let count = 10;
    
    if(!display) return;

    const interval = setInterval(() => {
      count--;
      if(count > 0) {
        display.textContent = count;
        // Add a little pop animation
        display.style.transform = 'scale(1.1)';
        setTimeout(() => {
          display.style.transform = 'scale(1)';
          display.style.transition = 'transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        }, 50);
      } else {
        display.textContent = "GO";
        display.classList.replace('text-championship-gold', 'text-pitch-green');
        display.classList.replace('drop-shadow-[0_0_15px_rgba(255,215,0,0.5)]', 'drop-shadow-[0_0_20px_rgba(0,255,65,0.8)]');
        clearInterval(interval);
      }
    }, 1000);
  });
