<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-surface": "#e5e2e1", "on-tertiary-container": "#005dc5", "primary": "#ebffe2", "surface-container-lowest": "#0e0e0e", "surface-container-high": "#2a2a2a", "secondary": "#fff9ef", "on-primary-fixed": "#002203", "secondary-container": "#ffdb3c", "error": "#ffb4ab", "on-secondary": "#3a3000", "on-tertiary": "#002e69", "championship-gold": "#FFD700", "on-secondary-container": "#725f00", "primary-fixed-dim": "#00e639", "glass-overlay": "rgba(255, 255, 255, 0.1)", "surface-obsidian": "#000000", "primary-fixed": "#72ff70", "tertiary-container": "#cedcff", "on-primary-container": "#007117", "pitch-green": "#00FF41", "inverse-primary": "#006e16", "on-primary-fixed-variant": "#00530e", "surface-variant": "#353534", "tertiary-fixed": "#d8e2ff", "tertiary": "#f9f8ff", "on-secondary-fixed": "#221b00", "on-secondary-fixed-variant": "#544600", "surface-container-low": "#1c1b1b", "on-error": "#690005", "surface-charcoal": "#1C1C1E", "inverse-on-surface": "#313030", "tertiary-fixed-dim": "#adc6ff", "outline": "#84967e", "secondary-fixed": "#ffe16d", "status-red": "#FF3B30", "on-background": "#e5e2e1", "surface-container": "#201f1f", "on-tertiary-fixed-variant": "#004493", "primary-container": "#00ff41", "outline-variant": "#3b4b37", "on-primary": "#003907", "surface": "#131313", "on-tertiary-fixed": "#001a41", "surface-dim": "#131313", "on-error-container": "#ffdad6", "surface-tint": "#00e639", "background": "#131313", "surface-bright": "#393939", "surface-container-highest": "#353534", "error-container": "#93000a", "inverse-surface": "#e5e2e1", "secondary-fixed-dim": "#e9c400", "on-surface-variant": "#b9ccb2" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "12px", "stack-tight": "4px", "base": "8px", "margin-mobile": "16px", "stack-loose": "20px", "margin-desktop": "24px" }, "fontFamily": { "stats-mono": ["Inter"], "body-lg": ["Inter"], "title-md": ["Inter"], "display-hero": ["Inter"], "body-sm": ["Inter"], "label-caps": ["Inter"], "headline-lg": ["Inter"], "headline-lg-mobile": ["Inter"] }, "fontSize": { "stats-mono": ["18px", { "lineHeight": "22px", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "title-md": ["20px", { "lineHeight": "26px", "fontWeight": "700" }], "display-hero": ["48px", { "lineHeight": "48px", "letterSpacing": "-0.04em", "fontWeight": "900" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }], "headline-lg": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "headline-lg-mobile": ["24px", { "lineHeight": "28px", "fontWeight": "800" }] } } } };</script><style>@layer base { body { @apply bg-surface text-on-surface; -webkit-tap-highlight-color: transparent; } .pb-safe { padding-bottom: env(safe-area-inset-bottom); } .pt-safe { padding-top: env(safe-area-inset-top); } } .glass { backdrop-filter: blur(20px); background: rgba(19, 19, 19, 0.8); }</style></head><body class="font-body-lg text-body-lg"><header class="fixed top-0 w-full z-50 glass pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"></header><main class="relative w-full pt-16 pb-24 bg-surface min-h-screen px-margin-mobile"><div class="flex flex-col w-full h-full min-h-[calc(100vh-4rem)] bg-surface relative justify-center px-margin-mobile pt-safe pb-24 overflow-hidden">
<!-- Animated ambient background -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<svg height="100%" preserveAspectRatio="none" viewBox="0 0 100 100" width="100%">
<defs>
<radialGradient cx="50%" cy="50%" id="glow1" r="50%">
<stop offset="0%" stop-color="#00FF41" stop-opacity="0.15"></stop>
<stop offset="100%" stop-color="#131313" stop-opacity="0"></stop>
</radialGradient>
</defs>
<circle class="animate-pulse" cx="20" cy="10" fill="url(#glow1)" r="40" style="animation-duration: 8s;"></circle>
<circle class="animate-pulse" cx="80" cy="90" fill="url(#glow1)" r="50" style="animation-duration: 12s; animation-delay: -4s;"></circle>
</svg>
</div>
<!-- Main Content Container -->
<div class="relative z-10 flex flex-col items-center w-full max-w-sm mx-auto space-y-stack-loose">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-4">
<div class="w-32 h-32 mb-6 rounded-2xl bg-surface-container-high/50 backdrop-blur-xl flex items-center justify-center shadow-[0_0_30px_rgba(0,255,65,0.1)]">
<img alt="UFL Logo" class="w-24 h-24 object-contain rounded-xl mix-blend-screen" src="https://lh3.googleusercontent.com/aida/AEtjO1WmZGNzAkh08rXlaa_F6A8q6RszCzLhLouIjul0SxK8UIhJ9L1b-vPnmE5aUvJmIWpXIwOBAL582hsBfWs7LS1D6ioBZJTfjOxkgcPQWhswBO2P8JQRv9WGJfq2PGRTbAHK4tYBq5F9crRFWf17jtlBUiXo42s8aVx2uSgjwXKsNtKb2_-NBPtdvXLTjm4V_2As5GdI1oziCwhAicy_k6HKFNo6hUoGidrWrgUAbmwi4NnARp2Gwi4sHBk">
</div>
<h1 class="font-display-hero text-display-hero text-on-surface text-center leading-tight tracking-tight">
                WELCOME<br><span class="text-pitch-green">BACK</span>
</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2 text-center">
                Enter the arena.
            </p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col space-y-gutter" id="loginForm">
<!-- Email Input -->
<div class="flex flex-col space-y-stack-tight">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1" for="email">Email or Phone</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant group-focus-within:text-pitch-green transition-colors">person</span>
<input class="w-full bg-surface-container-high text-on-surface font-body-lg rounded-xl pl-12 pr-4 py-4 focus:outline-none focus:ring-1 focus:ring-pitch-green/50 transition-all placeholder:text-on-surface-variant/50 shadow-inner" id="email" placeholder="player@ufl.com" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col space-y-stack-tight">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant group-focus-within:text-pitch-green transition-colors">lock</span>
<input class="w-full bg-surface-container-high text-on-surface font-body-lg rounded-xl pl-12 pr-12 py-4 focus:outline-none focus:ring-1 focus:ring-pitch-green/50 transition-all placeholder:text-on-surface-variant/50 shadow-inner" id="password" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibilityIcon">visibility_off</span>
</button>
</div>
<div class="flex justify-end pt-1">
<a class="font-body-sm text-body-sm text-pitch-green hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-pitch-green hover:bg-primary-fixed text-surface-obsidian font-headline-lg-mobile text-headline-lg-mobile uppercase py-4 rounded-xl shadow-[0_0_20px_rgba(0,255,65,0.2)] hover:shadow-[0_0_30px_rgba(0,255,65,0.4)] transition-all active:scale-[0.98] mt-4 flex items-center justify-center gap-2 group relative overflow-hidden" type="submit">
<span class="relative z-10 tracking-widest text-[20px]">LOGIN</span>
<span class="material-symbols-outlined relative z-10 group-hover:translate-x-1 transition-transform">arrow_forward</span>
<!-- Button Shine Effect -->
<div class="absolute inset-0 -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
</button>
</form>
<!-- Create Account Link -->
<div class="mt-8 text-center pb-8">
<span class="font-body-lg text-body-lg text-on-surface-variant">Don't have an account? </span>
<a class="font-title-md text-title-md text-on-surface hover:text-pitch-green transition-colors border-b border-transparent hover:border-pitch-green pb-1" href="#">Create Account</a>
</div>
</div>
</div>
<style>
    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }
</style>
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('visibilityIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.textContent = 'visibility';
        } else {
            passwordInput.type = 'password';
            icon.textContent = 'visibility_off';
        }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = this.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;
        
        // Simple loading state
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
        btn.classList.add('opacity-80', 'pointer-events-none');
        
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.classList.remove('opacity-80', 'pointer-events-none');
            // Mock successful login - normally would redirect
            btn.classList.replace('bg-pitch-green', 'bg-championship-gold');
            setTimeout(() => {
                btn.classList.replace('bg-championship-gold', 'bg-pitch-green');
            }, 500);
        }, 1500);
    });
</script></main><nav class="fixed bottom-0 w-full z-50 glass pb-safe" data-active-classes="text-pitch-green"></nav>

</body></html>
