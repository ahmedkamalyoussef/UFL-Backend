<script>
  document.addEventListener('DOMContentLoaded', () => {
    
    setTimeout(() => {
      document.getElementById('header-anim').style.transition = 'opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
      document.getElementById('header-anim').style.opacity = '1';
      document.getElementById('header-anim').style.transform = 'translateY(0)';
    }, 100);

    setTimeout(() => {
      document.getElementById('podium-3').style.transition = 'opacity 0.5s ease-out, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
      document.getElementById('podium-3').style.opacity = '1';
      document.getElementById('podium-3').style.transform = 'translateY(0)';
    }, 300);

    setTimeout(() => {
      document.getElementById('podium-2').style.transition = 'opacity 0.5s ease-out, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
      document.getElementById('podium-2').style.opacity = '1';
      document.getElementById('podium-2').style.transform = 'translateY(0)';
    }, 500);

    setTimeout(() => {
      document.getElementById('podium-1').style.transition = 'opacity 0.7s ease-out, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1)';
      document.getElementById('podium-1').style.opacity = '1';
      document.getElementById('podium-1').style.transform = 'translateY(0)';
      createCoinShower();
    }, 800);

    setTimeout(() => {
      document.getElementById('other-ranks').style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
      document.getElementById('other-ranks').style.opacity = '1';
      document.getElementById('other-ranks').style.transform = 'translateY(0)';
    }, 1200);

    
    function createCoinShower() {
      const canvas = document.getElementById('coin-canvas');
      const ctx = canvas.getContext('2d');
      const container = document.getElementById('match-results-container');
      
      canvas.width = container.offsetWidth;
      canvas.height = container.offsetHeight;

      const coins = [];
      const numCoins = 50;

      for (let i = 0; i < numCoins; i++) {
        coins.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * 100,
          size: Math.random() * 6 + 4,
          speedY: Math.random() * 3 + 2,
          speedX: (Math.random() - 0.5) * 2,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.2,
          color: Math.random() > 0.5 ? '#FFD700' : '#FFF9EF'
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let active = false;
        
        coins.forEach(coin => {
          if (coin.y < canvas.height) {
            active = true;
            coin.y += coin.speedY;
            coin.x += coin.speedX;
            coin.rotation += coin.rotationSpeed;

            ctx.save();
            ctx.translate(coin.x, coin.y);
            ctx.rotate(coin.rotation);
            ctx.beginPath();
            
            ctx.ellipse(0, 0, coin.size, coin.size * 0.7, 0, 0, Math.PI * 2);
            ctx.fillStyle = coin.color;
            ctx.fill();
            ctx.strokeStyle = '#B8860B';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
          }
        });

        if (active) {
          requestAnimationFrame(animate);
        } else {
            ctx.clearRect(0,0, canvas.width, canvas.height);
        }
      }

      animate();
    }
    
    window.addEventListener('resize', () => {
        const canvas = document.getElementById('coin-canvas');
        const container = document.getElementById('match-results-container');
        if(canvas && container) {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }
    })
  });
