<script>
    // Simple visual countdown logic for demo purposes
    document.addEventListener('DOMContentLoaded', () => {
      const timerElement = document.getElementById('draft-timer');
      if(timerElement) {
        let timeLeft = 35;
        setInterval(() => {
          timeLeft--;
          if (timeLeft < 0) timeLeft = 35; // Loop for demo
          
          timerElement.textContent = timeLeft;
          
          // Color change on low time
          if(timeLeft <= 10) {
            timerElement.classList.remove('text-pitch-green', 'drop-shadow-[0_0_15px_rgba(0,255,65,0.3)]');
            timerElement.classList.add('text-status-red', 'drop-shadow-[0_0_15px_rgba(255,59,48,0.3)]');
          } else if (timeLeft === 35) {
             timerElement.classList.add('text-pitch-green', 'drop-shadow-[0_0_15px_rgba(0,255,65,0.3)]');
             timerElement.classList.remove('text-status-red', 'drop-shadow-[0_0_15px_rgba(255,59,48,0.3)]');
          }
        }, 1000);
      }
    });
  </script>
